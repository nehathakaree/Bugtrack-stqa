{% extends "base.html" %}{% block content %}<div class="card p-4"><h1>Report bug</h1><form method="post">{% for key,label in [('title','Title'),('description','Description'),('steps_to_reproduce','Steps to reproduce')] %}<label class="form-label">{{ label }}</label><textarea class="form-control mb-3" name="{{ key }}" required></textarea>{% endfor %}{% for key,label in [('severity','Severity'),('priority','Priority')] %}<label>{{ label }}</label><select class="form-select mb-3" name="{{ key }}">{% for s in ['Low','Medium','High','Critical'] %}<option>{{ s }}</option>{% endfor %}</select>{% endfor %}<button class="btn btn-primary">Submit bug</button></form></div>{% endblock %}
