{% extends "base.html" %}{% block content %}<div class="card p-4"><h1>New test case</h1><form method="post">{% for key,label in [('title','Title'),('module','Module'),('steps','Steps'),('expected_result','Expected result')] %}<label class="form-label">{{ label }}</label><textarea class="form-control mb-3" name="{{ key }}" required></textarea>{% endfor %}<label>Priority</label><select class="form-select mb-3" name="priority">{% for s in ['Low','Medium','High','Critical'] %}<option>{{ s }}</option>{% endfor %}</select><button class="btn btn-primary">Save</button></form></div>{% endblock %}
