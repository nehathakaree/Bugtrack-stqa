{% extends "base.html" %}{% block content %}<h1>Test execution report</h1><div class="row g-3 my-3">{% for label,key in [('Total','total'),('Passed','Pass'),('Failed','Fail'),('Blocked','Blocked'),('Not run','Not Run')] %}<div class="col"><div class="card p-3"><small>{{ label }}</small><h2>{{ counts[key] }}</h2></div></div>{% endfor %}</div><h4>Pass rate: {{ counts.pass_rate }}%</h4><div class="progress"><div class="progress-bar" style="width:{{ counts.pass_rate }}%"></div></div>{% endblock %}
