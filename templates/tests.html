{% extends "base.html" %}{% block content %}<h1>Test cases</h1><a class="btn btn-primary mb-3" href="{{ url_for('new_test') }}">New test case</a><form class="d-flex mb-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Search title or module"><button class="btn btn-outline-primary">Search</button></form><div class="card p-3"><table class="table"><tr><th>Title</th><th>Module</th><th>Priority</th><th>Status</th></tr>{% for t in tests %}<tr><td>{{ t.title }}<br><small>{{ t.expected_result }}</small></td><td>{{ t.module }}</td><td>{{ t.priority }}</td><td><form method="post" action="{{ url_for('execute_test',test_id=t.id) }}"><select name="status" class="form-select">{% for s in ['Not Run','Pass','Fail','Blocked'] %}<option {{ 'selected' if t.status==s else '' }}>{{ s }}</option>{% endfor %}</select><button class="btn btn-sm btn-primary mt-1">Save</button></form></td></tr>{% else %}<tr><td colspan="4">No tests yet.</td></tr>{% endfor %}</table></div>{% endblock %}
