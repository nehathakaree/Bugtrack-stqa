{% extends "base.html" %}{% block content %}<h1>Bug reports</h1><a class="btn btn-primary mb-3" href="{{ url_for('new_bug') }}">Report bug</a><form class="d-flex mb-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Search bug title"><button class="btn btn-outline-primary">Search</button></form>{% for b in bugs %}<div class="card p-3 mb-3"><h5>{{ b.title }} <small>{{ b.severity }}</small></h5><p>{{ b.description }}</p><p>Steps: {{ b.steps_to_reproduce }}</p><form method="post" action="{{ url_for('update_bug_status',bug_id=b.id) }}"><select class="form-select" name="status">{% for s in ['Open','In Progress','Fixed','Retest','Closed'] %}<option {{ 'selected' if b.status==s else '' }}>{{ s }}</option>{% endfor %}</select><button class="btn btn-primary mt-2">Update status</button></form></div>{% else %}<p>No bug reports yet.</p>{% endfor %}{% endblock %}
